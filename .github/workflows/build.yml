name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile sources
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Windows one-file .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Verify assets
        run: python -c "from pathlib import Path; assert all(Path(p).exists() for p in ['assets/icon.ico','assets/icon.png','src/ui/styles/dark_theme.qss'])"
      - name: Build executable
        run: python build.py
      - name: Smoke test executable
        run: dist/TwitchFix.exe --version
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwitchFix-windows-x64
          path: dist/TwitchFix.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TwitchFix.exe
          generate_release_notes: true
          body: |
            ## TwitchFix ${{ github.ref_name }}
            Windows 10/11, one-file build. Run as Administrator to apply fixes.
            All fixes create backups in `%LOCALAPPDATA%\TwitchFix\backups`.
